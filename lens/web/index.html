<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pytest-lens · 测试质量看板</title>
<style>
  :root{
    --bg:#f6f6f4; --card:#ffffff; --line:#e6e5e1; --line-strong:#d5d4cf;
    --fg:#1b1b19; --muted:#6d6d67; --faint:#9a9a93;
    --pass:#2f7d4f; --pass-bg:#e7f3ea;
    --fail:#b4322c; --fail-bg:#fbeceb;
    --warn:#a15d0a; --warn-bg:#fbf1e2;
    --skip:#8a8a84; --skip-bg:#f0efec;
    --accent:#3d5a80;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#16161a; --card:#1e1e23; --line:#2e2e35; --line-strong:#3b3b44;
      --fg:#eceae4; --muted:#a3a29b; --faint:#75756f;
      --pass:#6cc48d; --pass-bg:#1b2c22;
      --fail:#e07a72; --fail-bg:#2e1c1b;
      --warn:#e0b062; --warn-bg:#2e2317;
      --skip:#9a9a94; --skip-bg:#26262b;
      --accent:#8fb0d6;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:13px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
  .wrap{max-width:1120px;margin:0 auto;padding:28px 20px 64px}
  header{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:22px}
  h1{font-size:16px;font-weight:600;margin:0;letter-spacing:.2px}
  .sub{color:var(--faint);font-size:12px}
  select{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line-strong);
         border-radius:7px;padding:5px 9px}
  button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line-strong);
         border-radius:7px;padding:5px 11px;cursor:pointer}
  button:hover{border-color:var(--muted)}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:18px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
  .kpi .k{color:var(--muted);font-size:12px}
  .kpi .v{font-size:22px;font-weight:600;margin-top:2px;letter-spacing:-.3px}
  .kpi .d{font-size:11px;color:var(--faint);margin-top:2px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:14px}
  .card h2{font-size:13px;font-weight:600;margin:0 0 12px;color:var(--fg)}
  .card h2 span{font-weight:400;color:var(--faint);margin-left:6px;font-size:12px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media (max-width:820px){.grid2{grid-template-columns:1fr}}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th{text-align:left;font-weight:500;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line)}
  td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
  tr:last-child td{border-bottom:none}
  code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px}
  .pill{display:inline-block;border-radius:20px;padding:1px 8px;font-size:11px;white-space:nowrap}
  .p-pass{background:var(--pass-bg);color:var(--pass)}
  .p-fail{background:var(--fail-bg);color:var(--fail)}
  .p-warn{background:var(--warn-bg);color:var(--warn)}
  .p-skip{background:var(--skip-bg);color:var(--skip)}
  .nodeid{color:var(--accent)}
  .msg{color:var(--muted);font-size:11.5px}
  .empty{color:var(--faint);font-size:12.5px;padding:6px 0}
  .bar{display:flex;align-items:flex-end;gap:3px;height:96px;margin-top:4px}
  .bar > div{flex:1;min-width:4px;border-radius:2px 2px 0 0;background:var(--pass);opacity:.85}
  .bar > div:hover{opacity:1}
  .axis{display:flex;justify-content:space-between;color:var(--faint);font-size:11px;margin-top:6px}
  .right{text-align:right}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>pytest-lens</h1>
    <span class="sub">测试结果聚合 · 失败聚类 · flaky 检测</span>
    <span style="flex:1"></span>
    <select id="project"></select>
    <button id="refresh">刷新</button>
  </header>

  <div class="kpis" id="kpis"></div>

  <div class="card">
    <h2>通过率趋势 <span id="trendNote"></span></h2>
    <div class="bar" id="trend"></div>
    <div class="axis"><span id="trendFrom"></span><span id="trendTo"></span></div>
  </div>

  <div class="grid2">
    <div class="card">
      <h2>失败聚类 <span>同一指纹 = 同一个 bug</span></h2>
      <div id="clusters"></div>
    </div>
    <div class="card">
      <h2>不稳定用例 <span>既通过过也失败过</span></h2>
      <div id="flaky"></div>
    </div>
  </div>

  <div class="card">
    <h2>最慢用例 TOP 10</h2>
    <div id="slowest"></div>
  </div>

  <div class="card">
    <h2>最近运行</h2>
    <div id="runs"></div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const pct = (v) => (v * 100).toFixed(1) + "%";
const api = (p, q = {}) => {
  const u = new URL(p, location.origin);
  Object.entries(q).forEach(([k, v]) => v != null && u.searchParams.set(k, v));
  return fetch(u).then((r) => (r.ok ? r.json() : Promise.reject(new Error(r.status + " " + u.pathname))));
};
const shortCommit = (c) => (c ? c.slice(0, 7) : "—");
const trimTime = (t) => (t || "").replace("T", " ").replace("+00:00", "Z").slice(5, 16);
const basename = (n) => String(n).split("::").pop();

function outcomePill(o) {
  const map = { passed: "p-pass", failed: "p-fail", error: "p-warn", skipped: "p-skip" };
  return `<span class="pill ${map[o] || "p-skip"}">${esc(o)}</span>`;
}

function rateColor(r) {
  if (r >= 0.999) return "var(--pass)";
  if (r >= 0.9) return "var(--warn)";
  return "var(--fail)";
}

function renderKpis(s) {
  const l = s.latest;
  if (!l) { $("kpis").innerHTML = '<div class="empty">暂无运行记录。</div>'; return; }
  const d = s.delta || {};
  const dTxt = (v, suffix = "", invert = false) => {
    if (v == null || v === 0) return "与上次持平";
    const good = invert ? v < 0 : v > 0;
    const color = good ? "var(--pass)" : "var(--fail)";
    const sign = v > 0 ? "+" : "";
    return `<span style="color:${color}">${sign}${typeof v === "number" && !Number.isInteger(v) ? v.toFixed(1) : v}${suffix}</span> 较上次`;
  };
  $("kpis").innerHTML = `
    <div class="kpi"><div class="k">通过率</div><div class="v" style="color:${rateColor(l.pass_rate)}">${pct(l.pass_rate)}</div>
      <div class="d">${dTxt(d.pass_rate == null ? null : d.pass_rate * 100, "%")}</div></div>
    <div class="kpi"><div class="k">用例总数</div><div class="v">${l.total}</div>
      <div class="d">跳过 ${l.skipped}</div></div>
    <div class="kpi"><div class="k">失败 / 错误</div><div class="v" style="color:${l.failed + l.errored ? "var(--fail)" : "var(--fg)"}">${l.failed} / ${l.errored}</div>
      <div class="d">${dTxt(d.failed, "")}</div></div>
    <div class="kpi"><div class="k">不稳定用例</div><div class="v" style="color:${s.flaky ? "var(--warn)" : "var(--fg)"}">${s.flaky ?? 0}</div>
      <div class="d">最近窗口内</div></div>
    <div class="kpi"><div class="k">用时</div><div class="v">${l.duration.toFixed(1)}<span style="font-size:12px;color:var(--muted)">s</span></div>
      <div class="d">${dTxt(d.duration == null ? null : d.duration, "s", true)}</div></div>
    <div class="kpi"><div class="k">最近运行</div><div class="v mono" style="font-size:15px">#${l.id} · ${shortCommit(l.git_commit)}</div>
      <div class="d">${esc(trimTime(l.started_at))}</div></div>
  `;
}

function renderTrend(rows) {
  if (!rows.length) { $("trend").innerHTML = ""; return; }
  $("trend").innerHTML = rows.map((r) => {
    const h = Math.max(3, Math.round(r.pass_rate * 92));
    const color = rateColor(r.pass_rate);
    const tip = `#${r.id} ${trimTime(r.started_at)}\n通过率 ${pct(r.pass_rate)}\n用例 ${r.total}，失败 ${r.failed + r.errored}`;
    return `<div style="height:${h}px;background:${color}" title="${esc(tip)}"></div>`;
  }).join("");
  const first = rows[0], last = rows[rows.length - 1];
  $("trendFrom").textContent = `#${first.id} · ${trimTime(first.started_at)}`;
  $("trendTo").textContent = `#${last.id} · ${trimTime(last.started_at)}`;
  $("trendNote").textContent = `最近 ${rows.length} 次`;
}

function renderClusters(rows) {
  if (!rows.length) { $("clusters").innerHTML = '<div class="empty">最近窗口内没有失败。</div>'; return; }
  $("clusters").innerHTML = `<table><tbody>${rows.map((c) => `
    <tr>
      <td style="width:88px"><code class="mono">${esc(c.fingerprint)}</code></td>
      <td>
        <div>${esc(c.message || "(无摘要)")}</div>
        <div class="msg">涉及 ${c.cases} 个用例 · 最近 ${esc(trimTime(c.last_seen))} · <span class="nodeid">${esc(basename(c.sample_cases?.[0] || ""))}</span></div>
      </td>
      <td class="right" style="width:56px"><span class="pill p-fail">×${c.occurrences}</span></td>
    </tr>`).join("")}</tbody></table>`;
}

function renderFlaky(rows) {
  if (!rows.length) { $("flaky").innerHTML = '<div class="empty">没有发现时好时坏的用例。</div>'; return; }
  $("flaky").innerHTML = `<table><tbody>${rows.map((f) => `
    <tr>
      <td>
        <div class="nodeid">${esc(f.nodeid)}</div>
        <div class="msg">通过 ${f.passes} 次 · 失败 ${f.fails} 次</div>
      </td>
      <td class="right" style="width:70px"><span class="pill p-warn">${f.flaky_score.toFixed(2)}</span></td>
    </tr>`).join("")}</tbody></table>`;
}

function renderSlowest(rows) {
  if (!rows.length) { $("slowest").innerHTML = '<div class="empty">暂无数据。</div>'; return; }
  const max = Math.max(...rows.map((r) => r.duration)) || 1;
  $("slowest").innerHTML = `<table>
    <thead><tr><th>用例</th><th>结果</th><th class="right" style="width:120px">耗时</th></tr></thead>
    <tbody>${rows.map((r) => `
      <tr>
        <td><span class="nodeid">${esc(r.nodeid)}</span></td>
        <td>${outcomePill(r.outcome)}</td>
        <td class="right mono">${r.duration.toFixed(3)}s
          <div style="height:3px;border-radius:2px;background:var(--line);margin-top:3px">
            <div style="height:3px;border-radius:2px;background:var(--accent);width:${Math.round(r.duration / max * 100)}%"></div>
          </div>
        </td>
      </tr>`).join("")}</tbody></table>`;
}

function renderRuns(rows) {
  $("runs").innerHTML = `<table>
    <thead><tr><th style="width:60px">运行</th><th style="width:110px">时间</th><th style="width:80px">提交</th>
      <th style="width:60px" class="right">用例</th><th style="width:70px" class="right">通过率</th>
      <th style="width:80px" class="right">失败/错误</th><th class="right" style="width:70px">用时</th></tr></thead>
    <tbody>${rows.map((r) => `
      <tr>
        <td class="mono">#${r.id}</td>
        <td>${esc(trimTime(r.started_at))}</td>
        <td><code class="mono">${shortCommit(r.git_commit)}</code></td>
        <td class="right">${r.total}</td>
        <td class="right" style="color:${rateColor(r.pass_rate)}">${pct(r.pass_rate)}</td>
        <td class="right">${r.failed + r.errored}</td>
        <td class="right mono">${r.duration.toFixed(1)}s</td>
      </tr>`).join("")}</tbody></table>`;
}

async function load(project) {
  const q = project ? { project } : {};
  const [summary, trend, clusters, flaky, slowest, runs] = await Promise.all([
    api("/api/summary", q),
    api("/api/trend", { ...q, limit: 30 }),
    api("/api/clusters", { ...q, limit: 12 }),
    api("/api/flaky", { ...q, min_runs: 3, limit: 12 }),
    api("/api/slowest", { ...q, limit: 10 }),
    api("/api/runs", { ...q, limit: 15 }),
  ]);
  renderKpis(summary);
  renderTrend(trend.trend || []);
  renderClusters(clusters.clusters || []);
  renderFlaky(flaky.flaky || []);
  renderSlowest(slowest.slowest || []);
  renderRuns(runs.runs || []);
}

async function boot() {
  const { projects = [] } = await api("/api/projects");
  const sel = $("project");
  if (!projects.length) {
    $("kpis").innerHTML = '<div class="empty">数据库里没有运行记录。先执行 <code>pytest --lens</code>，或 <code>lens seed-demo</code> 写入演示数据。</div>';
    sel.style.display = "none";
    return;
  }
  sel.innerHTML = projects.map((p) => `<option value="${esc(p.project)}">${esc(p.project)} · ${p.runs} 次运行</option>`).join("");
  const current = projects[0].project;
  sel.value = current;
  sel.onchange = () => load(sel.value).catch(showError);
  $("refresh").onclick = () => load(sel.value).catch(showError);
  await load(current);
}

function showError(err) {
  $("kpis").innerHTML = `<div class="empty">加载失败：${esc(err.message)}</div>`;
}

boot().catch(showError);
</script>
</body>
</html>

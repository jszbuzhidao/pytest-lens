name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装
        run: python -m pip install -e ".[dev]"

      - name: 跑测试
        run: python -m pytest -q

      - name: 覆盖率
        run: |
          python -m coverage run -m pytest -q
          python -m coverage report -m

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      # 注意：import 自检会加载 lens.api（依赖 fastapi/uvicorn），
      # 所以这里必须先安装依赖，否则 lint 会因为 ModuleNotFoundError 失败。
      - name: 安装
        run: python -m pip install -e ".[dev]"

      - name: 语法与导入自检
        run: |
          python -m compileall -q lens tests
          python -c "import lens, lens.api, lens.cli, lens.plugin, lens.report; print('imports ok')"

      - name: 插件入口自检
        run: |
          pytest --help | grep -q -- "--lens" && echo "pytest11 entrypoint ok"
          lens stats --help >/dev/null && echo "cli ok"

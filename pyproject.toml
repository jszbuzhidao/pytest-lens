[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pytest-lens"
version = "0.1.0"
description = "pytest test-result aggregation with failure clustering, flaky detection and a web dashboard"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["pytest>=7.4"]

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn>=0.27"]
dev = ["fastapi>=0.110", "uvicorn>=0.27", "httpx>=0.27", "pytest-cov>=5.0"]

[project.scripts]
lens = "lens.cli:main"

[project.entry-points.pytest11]
lens = "lens.plugin"

[tool.setuptools.packages.find]
include = ["lens*"]

[tool.setuptools.package-data]
lens = ["web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

# 注意：本项目通过 pytest11 入口注册插件，pytest 会在 pytest-cov 开始计量之前
# 就 import lens，导致 --cov 把整个包的模块级代码算成「未执行」。
# 想要准确的覆盖率，请用：coverage run -m pytest
[tool.coverage.run]
source = ["lens"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
